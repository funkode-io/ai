id = "funkode.status-bar"
name = "Funkode Status Bar"
version = "0.1.0"
description = "Tab-bar status segments for Herdr: active treehouse worktree, agent context consumption, and PR number."
min_herdr_version = "0.8.2"
platforms = ["macos", "linux"]

# Print the TOML snippet to paste into ~/.config/herdr/config.toml.
[[actions]]
id = "print-config"
title = "Status Bar: print config snippet"
description = "Print the ui.tab_bar_right entries that render these segments."
contexts = ["global"]
command = ["bin/herdr-status", "print-config"]

# Diagnose each segment and show what it resolves to right now.
[[actions]]
id = "doctor"
title = "Status Bar: doctor"
description = "Show the resolved focused pane and every segment's value and source."
contexts = ["global"]
command = ["bin/herdr-status", "doctor"]

# Refresh the cached PR number for the focused pane using the gh CLI.
[[actions]]
id = "refresh-pr"
title = "Status Bar: refresh PR number"
description = "Ask gh for the PR of the focused pane's branch and cache it for the status bar."
contexts = ["global", "workspace", "pane"]
command = ["bin/herdr-status", "refresh-pr"]

# Keep the PR cache warm without blocking the status bar's refresh tick.
# Plugin event hooks use the dotted event names, not the snake_case API ones.
[[events]]
on = "workspace.focused"
command = ["bin/herdr-status", "refresh-pr", "--quiet"]

[[events]]
on = "pane.focused"
command = ["bin/herdr-status", "refresh-pr", "--quiet"]
